<style>
  /* Let the block's height follow the iframe instead of the Fluid Engine grid. */
  .fluid-engine:has(#news-travel-time) { display: block !important; height: auto !important; }
  .fluid-engine:has(#news-travel-time) > .fe-block { grid-area: auto !important; height: auto !important; }
</style>
<iframe id="news-travel-time" src="https://acorvin.github.io/news-travel-time/" title="The Speed of News" loading="lazy" style="width:100%;height:1700px;border:0;display:block;background:#ffffff"></iframe>
<script>
window.addEventListener('message', function (e) {
  if (e.data && e.data.type === 'news-travel-time-height') {
    document.getElementById('news-travel-time').style.height = e.data.height + 'px';
  }
});
</script>
